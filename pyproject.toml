[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consistent-t2i"
version = "0.1.0"
description = "Continuity-first text-to-image orchestration for web novel to webtoon pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".omx", "outputs", "tmp*"]
